version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: psicopedagogia_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-psicopedagogia}
      MYSQL_USER: ${MYSQL_USER:-psico_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-psico_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - psicopedagogia_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: psicopedagogia_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: mysql://${MYSQL_USER:-psico_user}:${MYSQL_PASSWORD:-psico_password}@mysql:3306/${MYSQL_DATABASE:-psicopedagogia}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - psicopedagogia_net
    command: >
      sh -c "npx prisma db push --accept-data-loss && (node prisma/seeds/index.js || true) && node src/server.js"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: psicopedagogia_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - psicopedagogia_net

volumes:
  mysql_data:

networks:
  psicopedagogia_net:
    driver: bridge
